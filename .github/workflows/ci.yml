name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # pokedata.json はコミットしてあるので、ここではネットワークに出ない
      - run: node build.mjs
      - run: node test.mjs
